<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CUBRID page buffer의 네 개 독립 상태 축</title>
  <desc id="desc">하나의 page를 identity와 residency, ownership, concurrency, durability의 네 축으로 나누어 보여준다. 각 축은 관련 CUBRID 구조와 상태 전이를 함께 표시한다.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="1" stop-color="#007c78"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#48626f"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1160" height="80" rx="18" fill="url(#header)"/>
  <text x="600" y="56" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#ffffff">한 page, 네 개의 독립 상태 축</text>
  <text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#d8f1ef">fix · latch · dirty · flush · eviction은 같은 상태가 아니다</text>

  <g font-family="sans-serif">
    <rect x="35" y="130" width="265" height="330" rx="18" fill="#edf5ff" stroke="#2769a5" stroke-width="2"/>
    <text x="167" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#173443">1. Identity / Residency</text>
    <text x="167" y="202" text-anchor="middle" font-size="15" fill="#526874">VPID ↔ BCB ↔ frame</text>
    <rect x="70" y="230" width="195" height="52" rx="10" fill="#ffffff" stroke="#7ea7ca"/>
    <text x="167" y="262" text-anchor="middle" font-size="16" fill="#173443">absent</text>
    <path d="M167 282V317" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="320" width="195" height="52" rx="10" fill="#ffffff" stroke="#7ea7ca"/>
    <text x="167" y="352" text-anchor="middle" font-size="16" fill="#173443">resident</text>
    <path d="M167 372V407" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="167" y="438" text-anchor="middle" font-size="14" fill="#526874">victim reuse → 다른 VPID</text>

    <rect x="325" y="130" width="265" height="330" rx="18" fill="#eef9f5" stroke="#27836f" stroke-width="2"/>
    <text x="457" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#173443">2. Ownership</text>
    <text x="457" y="202" text-anchor="middle" font-size="15" fill="#526874">global fcnt + thread holder</text>
    <rect x="360" y="230" width="195" height="52" rx="10" fill="#ffffff" stroke="#77b8a8"/>
    <text x="457" y="262" text-anchor="middle" font-size="16" fill="#173443">unfixed</text>
    <path d="M457 282V317" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="360" y="320" width="195" height="52" rx="10" fill="#ffffff" stroke="#77b8a8"/>
    <text x="457" y="352" text-anchor="middle" font-size="16" fill="#173443">fixed × N</text>
    <path d="M457 372V407" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="457" y="438" text-anchor="middle" font-size="14" fill="#526874">matching unfix마다 1 감소</text>

    <rect x="615" y="130" width="265" height="330" rx="18" fill="#fff7e9" stroke="#c67a2c" stroke-width="2"/>
    <text x="747" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#173443">3. Concurrency</text>
    <text x="747" y="202" text-anchor="middle" font-size="15" fill="#526874">latch mode + waiter queue</text>
    <rect x="650" y="230" width="195" height="52" rx="10" fill="#ffffff" stroke="#d8a266"/>
    <text x="747" y="262" text-anchor="middle" font-size="16" fill="#173443">NO_LATCH</text>
    <path d="M747 282V317" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="650" y="320" width="195" height="52" rx="10" fill="#ffffff" stroke="#d8a266"/>
    <text x="747" y="352" text-anchor="middle" font-size="16" fill="#173443">READ / WRITE</text>
    <path d="M747 372V407" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="747" y="438" text-anchor="middle" font-size="14" fill="#526874">conditional reject / wait / wake</text>

    <rect x="905" y="130" width="265" height="330" rx="18" fill="#fff0f0" stroke="#b74b52" stroke-width="2"/>
    <text x="1037" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#173443">4. Durability</text>
    <text x="1037" y="202" text-anchor="middle" font-size="15" fill="#526874">dirty + page LSA + FLUSHING</text>
    <rect x="940" y="220" width="195" height="48" rx="10" fill="#ffffff" stroke="#d78b90"/>
    <text x="1037" y="250" text-anchor="middle" font-size="15" fill="#173443">clean resident</text>
    <path d="M1037 268V296" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="940" y="299" width="195" height="48" rx="10" fill="#ffffff" stroke="#d78b90"/>
    <text x="1037" y="329" text-anchor="middle" font-size="15" fill="#173443">dirty</text>
    <path d="M1037 347V375" stroke="#48626f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="940" y="378" width="195" height="48" rx="10" fill="#ffffff" stroke="#d78b90"/>
    <text x="1037" y="408" text-anchor="middle" font-size="15" fill="#173443">WAL gate → data write</text>
    <text x="1037" y="448" text-anchor="middle" font-size="14" fill="#526874">flush 중 다시 dirty 가능</text>
  </g>
</svg>
