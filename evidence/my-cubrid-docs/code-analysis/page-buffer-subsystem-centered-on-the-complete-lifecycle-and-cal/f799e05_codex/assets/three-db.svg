<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="title desc"><title id="title">CUBRID PostgreSQL InnoDB 책임 비교</title><desc id="desc">세 데이터베이스의 lookup, pin 또는 fix, latch lifetime, dirty flush와 replacement 책임의 차이</desc><g font-family="sans-serif"><g fill="#18202b" font-size="20" font-weight="bold"><text x="30" y="65">CUBRID</text><text x="30" y="180">PostgreSQL</text><text x="30" y="295">InnoDB</text></g><g fill="#e8f1fc" stroke="#1558a6" stroke-width="2"><rect x="170" y="25" width="180" height="70" rx="10"/><rect x="385" y="25" width="180" height="70" rx="10"/><rect x="600" y="25" width="180" height="70" rx="10"/><rect x="170" y="140" width="180" height="70" rx="10"/><rect x="385" y="140" width="180" height="70" rx="10"/><rect x="600" y="140" width="180" height="70" rx="10"/><rect x="170" y="255" width="180" height="70" rx="10"/><rect x="385" y="255" width="180" height="70" rx="10"/><rect x="600" y="255" width="180" height="70" rx="10"/></g><g fill="#18202b" font-size="16" text-anchor="middle"><text x="260" y="55">fix = residency</text><text x="260" y="78">+ holder</text><text x="475" y="55">latch in same API</text><text x="475" y="78">timed wait/conditional</text><text x="690" y="55">LRU zones + DWB</text><text x="690" y="78">WAL before data</text><text x="260" y="170">ReadBuffer pin</text><text x="260" y="193">mapping before I/O</text><text x="475" y="170">separate content lock</text><text x="475" y="193">ResourceOwner</text><text x="690" y="170">clock sweep + FPI</text><text x="690" y="193">XLogFlush</text><text x="260" y="285">buf_fix_count</text><text x="260" y="308">BUF_IO_READ</text><text x="475" y="285">S/SX/X in MTR</text><text x="475" y="308">memo lifetime</text><text x="690" y="285">midpoint LRU</text><text x="690" y="308">redo + optional DWB</text></g><text x="490" y="370" text-anchor="middle" font-size="16" fill="#9c2f2f">같은 책임은 있으나 Interface·publication timing·storage organization은 부분 유사 또는 비동치</text></g></svg>
