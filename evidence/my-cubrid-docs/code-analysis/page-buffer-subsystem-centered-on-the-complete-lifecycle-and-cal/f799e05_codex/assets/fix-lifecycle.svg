  <title id="title">pgbuf_fix 전체 생명주기</title><desc id="desc">VPID 입력에서 hit 또는 miss, latch와 holder, PAGE_PTR 사용, dirty 표시, unfix와 LRU 복귀까지의 흐름</desc>
