<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Durability responsibilities and concurrent re-dirty timeline</title>
  <desc id="desc">Four responsibility lanes separate write permission, recoverability, transaction durability, and page propagation. A lower timeline shows snapshot generation G completing while a concurrent mutation creates dirty generation G plus one.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f6672"/></marker>
    <style>
      .lane{fill:#f7fafb;stroke:#d4dfe3;stroke-width:2}.box{fill:#fff;stroke:#7895a2;stroke-width:2}.teal{fill:#e6f5f1;stroke:#168d86;stroke-width:2}.amber{fill:#fff2dc;stroke:#c9782d;stroke-width:2}.blue{fill:#edf1fb;stroke:#536eaf;stroke-width:2}.red{fill:#fff0f0;stroke:#c54b4b;stroke-width:2}.title{font:800 15px Inter,Arial,sans-serif;fill:#123a52;letter-spacing:1px}.text{font:700 16px Inter,Arial,sans-serif;fill:#173443}.small{font:13px Inter,Arial,sans-serif;fill:#526874}.line{fill:none;stroke:#4f6672;stroke-width:2.5;marker-end:url(#arrow)}.redline{fill:none;stroke:#c54b4b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="20" y="20" width="1160" height="355" rx="20" class="lane"/>
  <text x="45" y="52" class="title">WRITE PERMISSION</text>
  <rect x="230" y="32" width="205" height="64" rx="13" class="teal"/><text x="333" y="59" text-anchor="middle" class="text">WRITE latch</text><text x="333" y="81" text-anchor="middle" class="small">mutate resident bytes</text>
  <text x="45" y="135" class="title">RECOVERABILITY</text>
  <rect x="230" y="112" width="205" height="64" rx="13" class="amber"/><text x="333" y="139" text-anchor="middle" class="text">Append recovery log</text><text x="333" y="161" text-anchor="middle" class="small">advance page LSA</text>
  <path d="M435 144H500" class="line"/><rect x="502" y="112" width="225" height="64" rx="13" class="amber"/><text x="615" y="139" text-anchor="middle" class="text">Mark DIRTY</text><text x="615" y="161" text-anchor="middle" class="small">track lower bound</text>
  <text x="45" y="218" class="title">TRANSACTION DURABILITY</text>
  <rect x="230" y="195" width="255" height="64" rx="13" class="teal"/><text x="358" y="222" text-anchor="middle" class="text">Commit WAL durable</text><text x="358" y="244" text-anchor="middle" class="small">home page may remain dirty</text>
  <text x="45" y="301" class="title">PAGE PROPAGATION</text>
  <rect x="230" y="278" width="195" height="64" rx="13" class="blue"/><text x="328" y="305" text-anchor="middle" class="text">Snapshot G</text><text x="328" y="327" text-anchor="middle" class="small">FLUSHING; clear DIRTY</text>
  <path d="M425 310H475" class="line"/><rect x="477" y="278" width="185" height="64" rx="13" class="amber"/><text x="570" y="305" text-anchor="middle" class="text">Force WAL</text><text x="570" y="327" text-anchor="middle" class="small">through copied LSA</text>
  <path d="M662 310H712" class="line"/><rect x="714" y="278" width="205" height="64" rx="13" class="blue"/><text x="817" y="305" text-anchor="middle" class="text">DWB / direct write</text><text x="817" y="327" text-anchor="middle" class="small">configured boundary</text>
  <path d="M919 310H969" class="line"/><rect x="971" y="278" width="175" height="64" rx="13" class="teal"/><text x="1059" y="305" text-anchor="middle" class="text">Complete G</text><text x="1059" y="327" text-anchor="middle" class="small">clear FLUSHING only</text>

  <rect x="20" y="405" width="1160" height="220" rx="20" class="lane"/>
  <text x="45" y="438" class="title">CONCURRENT GENERATION TIMELINE</text>
  <rect x="80" y="470" width="215" height="95" rx="14" class="blue"/><text x="188" y="501" text-anchor="middle" class="text">Generation G</text><text x="188" y="525" text-anchor="middle" class="small">snapshot LSA 140</text><text x="188" y="547" text-anchor="middle" class="small">FLUSHING; resident clean slot</text>
  <path d="M295 517H450" class="line"/>
  <rect x="452" y="470" width="220" height="95" rx="14" class="red"/><text x="562" y="501" text-anchor="middle" class="text">Re-dirty G+1</text><text x="562" y="525" text-anchor="middle" class="small">resident LSA 170</text><text x="562" y="547" text-anchor="middle" class="small">set new DIRTY + lower bound</text>
  <path d="M672 517H827" class="redline"/>
  <rect x="829" y="470" width="270" height="95" rx="14" class="teal"/><text x="964" y="501" text-anchor="middle" class="text">G completes</text><text x="964" y="525" text-anchor="middle" class="small">clear old FLUSHING</text><text x="964" y="547" text-anchor="middle" class="small">G+1 stays DIRTY</text>
  <text x="600" y="601" text-anchor="middle" class="small">Completion belongs to the copied generation; it must not erase newer resident work.</text>
</svg>
