<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Latch holder 상태 전이</title><desc id="desc">NO_LATCH에서 READ와 WRITE grant, conflict wait 또는 conditional reject, 마지막 unfix로 돌아오는 전이</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1558a6"/></marker></defs><g fill="#fff" stroke="#1558a6" stroke-width="2"><circle cx="120" cy="150" r="65"/><circle cx="390" cy="80" r="65"/><circle cx="390" cy="220" r="65"/><circle cx="700" cy="150" r="65"/></g><g font-family="sans-serif" font-size="17" text-anchor="middle"><text x="120" y="145">NO_LATCH</text><text x="120" y="170">fcnt=0</text><text x="390" y="75">READ</text><text x="390" y="100">shared fcnt</text><text x="390" y="215">WRITE</text><text x="390" y="240">holder</text><text x="700" y="145">WAIT / REJECT</text><text x="700" y="170">condition 분기</text></g><g fill="none" stroke="#1558a6" stroke-width="2" marker-end="url(#b)"><path d="M180 120L325 90"/><path d="M180 180L325 210"/><path d="M455 90L635 135"/><path d="M455 210L635 165"/><path d="M350 137L350 163"/><path d="M325 70C220 20 120 70 120 85"/><path d="M325 235C220 285 120 230 120 215"/></g></svg>
