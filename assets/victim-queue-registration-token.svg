<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 845" role="img" aria-labelledby="title desc">
<title id="title">Repeated insertion and registration ownership</title><desc id="desc">A second candidate does not enqueue a second 32. Consume removes the entry; pre-scan requeue transfers it to big-private, preserving the flag and allowing concurrent scans.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#143c50"/></marker></defs>
<rect width="1000" height="845" fill="#fffefb" rx="12"/>
<g font-family="sans-serif" fill="#17212b"><text x="30" y="43" font-size="29">Same integer again, without a duplicate queued entry</text><text x="30" y="80" font-size="21">Constructed trace: P = list 32; assume it qualifies for big-private requeue.</text><text x="35" y="127" font-size="18">EVENT</text><text x="545" y="127" font-size="18">ORDINARY</text><text x="710" y="127" font-size="18">BIG</text><text x="855" y="127" font-size="18">FLAG</text><rect x="30" y="145" width="940" height="88" rx="9" fill="#edf5f4" stroke="#087c78" stroke-width="2"/><text x="47" y="177" font-size="21">Initial publication of P</text><text x="566" y="177" font-size="25">[32]</text><text x="723" y="177" font-size="25">[ ]</text><text x="863" y="177" font-size="21">set</text><text x="47" y="211" font-size="19">CAS claims registration, then produce(32).</text><rect x="30" y="249" width="940" height="88" rx="9" fill="#edf5f4" stroke="#087c78" stroke-width="2"/><text x="47" y="281" font-size="21">Another BCB becomes a candidate</text><text x="566" y="281" font-size="25">[32]</text><text x="723" y="281" font-size="25">[ ]</text><text x="863" y="281" font-size="21">set</text><text x="47" y="315" font-size="19">Count increases; set flag suppresses another publication.</text><rect x="30" y="353" width="940" height="88" rx="9" fill="#edf5f4" stroke="#087c78" stroke-width="2"/><text x="47" y="385" font-size="21">Consumer A pops 32</text><text x="566" y="385" font-size="25">[ ]</text><text x="723" y="385" font-size="25">[ ]</text><text x="863" y="385" font-size="21">set</text><text x="47" y="419" font-size="19">The entry is gone, but A still holds the registration.</text><rect x="30" y="457" width="940" height="88" rx="9" fill="#edf5f4" stroke="#087c78" stroke-width="2"/><text x="47" y="489" font-size="21">A requeues before scanning P</text><text x="566" y="489" font-size="25">[ ]</text><text x="723" y="489" font-size="25">[32]</text><text x="863" y="489" font-size="21">set</text><text x="47" y="523" font-size="19">This is a new insertion after the old entry was consumed.</text><rect x="30" y="561" width="940" height="88" rx="9" fill="#edf5f4" stroke="#087c78" stroke-width="2"/><text x="47" y="593" font-size="21">Consumer B can now pop 32</text><text x="566" y="593" font-size="25">[ ]</text><text x="723" y="593" font-size="25">[ ]</text><text x="863" y="593" font-size="21">set</text><text x="47" y="627" font-size="19">A and B may overlap their scans of P.</text><text x="30" y="702" font-size="22">One PGBUF_LRU_VICTIM_LFCQ_FLAG covers BOTH private queues.</text><text x="30" y="737" font-size="20">It tracks registration, including consumer-held state, not exact queue presence.</text><text x="30" y="780" font-size="19">If a consumer does not requeue: clear flag → later publication can register P again.</text><text x="30" y="813" font-size="19">Shared uses the same flag protocol; it requeues after scanning.</text></g></svg>
