<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Page-buffer daemon creation, recovery gate, loop, and destruction lifecycle</title>
  <desc id="desc">The pool exists before daemon threads are created. Tasks execute but return while the recovery gate is closed. After the gate opens, timers or work wakes drive useful loops. Shutdown stops, wakes, and joins all daemon threads before log finalization and pool destruction.</desc>
  <defs><style>.bg{fill:#f7f5ef}.box{fill:#fff;stroke:#26384a;stroke-width:2}.blue{fill:#eaf3ff;stroke:#2563a8}.green{fill:#eaf8ef;stroke:#287a45}.orange{fill:#fff3dc;stroke:#a86413}.h{font:700 27px system-ui,sans-serif;fill:#172331}.t{font:700 17px system-ui,sans-serif;fill:#172331}.s{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.arrow{stroke:#526273;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526273"/></marker></defs>
  <rect class="bg" width="1200" height="560" rx="24"/><text class="h" x="50" y="58">Creation, enablement, useful work, and destruction are separate moments</text>
  <rect class="box blue" x="45" y="125" width="185" height="115" rx="16"/><text class="t" x="75" y="163">Pool ready</text><text class="s" x="75" y="193">LRUs · queues</text><text class="s" x="75" y="217">BCBs · monitors</text>
  <path class="arrow" d="M230 183h55"/><rect class="box orange" x="285" y="105" width="230" height="155" rx="16"/><text class="t" x="315" y="143">Create 4 threads</text><text class="s" x="315" y="174">task executes immediately</text><text class="s" x="315" y="201">gate closed → return</text><text class="tiny" x="315" y="230">then each looper pauses</text>
  <path class="arrow" d="M515 183h55"/><rect class="box green" x="570" y="105" width="265" height="155" rx="16"/><text class="t" x="600" y="143">Recovery completes</text><text class="s" x="600" y="174">boot gate opens</text><text class="s" x="600" y="201">timer/work wake arrives</text><text class="tiny" x="600" y="230">gate open alone sends no wake</text>
  <path class="arrow" d="M835 183h55"/><rect class="box blue" x="890" y="105" width="265" height="155" rx="16"/><text class="t" x="920" y="143">Useful control loops</text><text class="s" x="920" y="174">execute task</text><text class="s" x="920" y="201">pause by own looper</text><text class="tiny" x="920" y="230">repeat until stop</text>
  <path class="arrow" d="M1022 260v95H830"/><rect class="box orange" x="500" y="335" width="330" height="135" rx="16"/><text class="t" x="535" y="374">Shutdown: stop → wake → join</text><text class="s" x="535" y="405">retire task and context</text><text class="s" x="535" y="432">clear daemon pointers</text>
  <path class="arrow" d="M500 402H375"/><rect class="box blue" x="45" y="335" width="330" height="135" rx="16"/><text class="t" x="80" y="374">Pool still alive for log_final()</text><text class="s" x="80" y="405">then DWB/pool dependencies retire</text><text class="tiny" x="80" y="432">no daemon outlives shared state</text>
  <text class="tiny" x="327" y="525">Stand-alone mode creates no four-thread group; the requesting caller performs the relevant work synchronously.</text>
</svg>
