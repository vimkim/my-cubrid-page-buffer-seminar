<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="object-map-title object-map-desc">
  <title id="object-map-title">Six page-buffer objects and their ownership relationships</title>
  <desc id="object-map-desc">A VPID identifies a resident BCB paired with a frame. PAGE_PTR is a borrowed view into that frame. Global fcnt and a thread holder record the outstanding ownership debt that prevents frame reuse.</desc>
  <defs>
    <marker id="solid-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#405b68"/>
    </marker>
    <marker id="debt-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#72502b"/>
    </marker>
    <style>
      .title { font: 700 25px Inter, Arial, sans-serif; fill: #173443; }
      .subtitle { font: 15px Inter, Arial, sans-serif; fill: #526874; }
      .node-title { font: 700 20px Inter, Arial, sans-serif; fill: #173443; }
      .node-copy { font: 14px Inter, Arial, sans-serif; fill: #405763; }
      .edge-label { font: 700 13px Inter, Arial, sans-serif; fill: #405763; }
      .primary { fill: #f7fafb; stroke: #405b68; stroke-width: 2; }
      .identity { fill: #edf5ff; stroke: #2f6690; stroke-width: 2; }
      .borrow { fill: #fff8ea; stroke: #9a672f; stroke-width: 2; stroke-dasharray: 8 5; }
      .ledger { fill: #eef8f4; stroke: #287966; stroke-width: 2; }
      .solid { fill: none; stroke: #405b68; stroke-width: 2.5; marker-end: url(#solid-arrow); }
      .pair { fill: none; stroke: #405b68; stroke-width: 2.5; marker-start: url(#solid-arrow); marker-end: url(#solid-arrow); }
      .debt { fill: none; stroke: #72502b; stroke-width: 2.5; stroke-dasharray: 8 5; marker-end: url(#debt-arrow); }
    </style>
  </defs>

  <rect x="20" y="20" width="1120" height="580" rx="22" fill="#ffffff" stroke="#d8e1e5" stroke-width="2"/>
  <text x="580" y="58" text-anchor="middle" class="title">Identity, storage, view, and debt are different objects</text>
  <text x="580" y="84" text-anchor="middle" class="subtitle">Solid lines are resident structure; dashed lines are temporary borrowing or ownership debt.</text>

  <rect x="50" y="165" width="185" height="120" rx="16" class="identity"/>
  <text x="143" y="202" text-anchor="middle" class="node-title">VPID</text>
  <text x="143" y="228" text-anchor="middle" class="node-copy">volid + pageid</text>
  <text x="143" y="252" text-anchor="middle" class="node-copy">logical identity value</text>

  <rect x="345" y="135" width="260" height="180" rx="16" class="primary"/>
  <text x="475" y="174" text-anchor="middle" class="node-title">BCB</text>
  <text x="475" y="202" text-anchor="middle" class="node-copy">current VPID + control state</text>
  <text x="475" y="226" text-anchor="middle" class="node-copy">latch, flags, list links</text>
  <rect x="390" y="249" width="170" height="44" rx="10" class="ledger"/>
  <text x="475" y="277" text-anchor="middle" class="node-copy">Global fcnt</text>

  <rect x="720" y="135" width="220" height="180" rx="16" class="primary"/>
  <text x="830" y="174" text-anchor="middle" class="node-title">Frame</text>
  <text x="830" y="202" text-anchor="middle" class="node-copy">PGBUF_IOPAGE_BUFFER</text>
  <text x="830" y="226" text-anchor="middle" class="node-copy">resident page bytes</text>
  <text x="830" y="275" text-anchor="middle" class="node-copy">reusable pool storage</text>

  <rect x="760" y="415" width="250" height="115" rx="16" class="borrow"/>
  <text x="885" y="452" text-anchor="middle" class="node-title">PAGE_PTR</text>
  <text x="885" y="480" text-anchor="middle" class="node-copy">borrowed view into Frame</text>
  <text x="885" y="504" text-anchor="middle" class="node-copy">valid only while fix debt remains</text>

  <rect x="285" y="415" width="260" height="115" rx="16" class="ledger"/>
  <text x="415" y="452" text-anchor="middle" class="node-title">Thread holder</text>
  <text x="415" y="480" text-anchor="middle" class="node-copy">BCB pointer + nested fix_count</text>
  <text x="415" y="504" text-anchor="middle" class="node-copy">this thread's ownership ledger</text>

  <path d="M235 225H345" class="solid"/>
  <text x="290" y="211" text-anchor="middle" class="edge-label">lookup key</text>
  <path d="M605 225H720" class="pair"/>
  <text x="663" y="211" text-anchor="middle" class="edge-label">paired 1:1</text>
  <path d="M830 315V415" class="debt"/>
  <text x="842" y="368" class="edge-label">borrowed view</text>
  <path d="M415 415V315H445" class="debt"/>
  <text x="305" y="365" class="edge-label">debt points to BCB</text>

  <rect x="55" y="395" width="210" height="150" rx="14" fill="#f9fafb" stroke="#899aa2" stroke-width="2"/>
  <text x="160" y="428" text-anchor="middle" class="node-title">Reuse boundary</text>
  <text x="160" y="456" text-anchor="middle" class="node-copy">Global fcnt = 0 is necessary</text>
  <text x="160" y="478" text-anchor="middle" class="node-copy">but not sufficient before</text>
  <text x="160" y="500" text-anchor="middle" class="node-copy">the BCB/Frame can represent</text>
  <text x="160" y="522" text-anchor="middle" class="node-copy">another VPID</text>
  <path d="M345 280C270 300 260 380 235 420" class="solid"/>

  <text x="580" y="574" text-anchor="middle" class="subtitle">A pointer address is not page identity. Matching unfix repays a debt; it does not deallocate the VPID.</text>
</svg>
