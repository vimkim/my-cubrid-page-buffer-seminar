<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ordered fix breaks a two-page latch cycle before sleeping</title>
  <desc id="desc">Without a common order, two threads hold pages A and B and wait for one another. Ordered fix conditionally tries the request and makes the thread holding the later page B release it before waiting for earlier page A.</desc>
  <defs>
    <style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#26384a;stroke-width:2}.bad{fill:#fff0f0;stroke:#b33b3b}.good{fill:#eaf8ef;stroke:#287a45}.h{font:700 27px system-ui,sans-serif;fill:#172331}.t{font:700 19px system-ui,sans-serif;fill:#172331}.s{font:15px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.line{stroke:#526273;stroke-width:3;fill:none;marker-end:url(#m)}.cycle{stroke:#b33b3b;stroke-width:3;fill:none;marker-end:url(#r)}.release{stroke:#287a45;stroke-width:4}.label{font:700 13px system-ui,sans-serif;fill:#526273}</style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526273"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#b33b3b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <text class="h" x="52" y="52">The key operation is release before sleep</text>

  <rect class="panel bad" x="50" y="85" width="1100" height="250" rx="18"/>
  <text class="t" x="82" y="122">Unordered: A &lt; B, but the two threads acquired in opposite directions</text>
  <rect class="panel" x="95" y="160" width="330" height="110" rx="14"/>
  <text class="t" x="125" y="195">Thread T1</text><text class="s" x="125" y="225">holds B → requests A → sleeps</text>
  <rect class="panel" x="775" y="160" width="330" height="110" rx="14"/>
  <text class="t" x="805" y="195">Thread T2</text><text class="s" x="805" y="225">holds A → requests B → sleeps</text>
  <path class="cycle" d="M425 190C560 125 640 125 775 190"/>
  <path class="cycle" d="M775 245C640 315 560 315 425 245"/>
  <text class="label" x="525" y="151">T1 waits for T2</text><text class="label" x="525" y="302">T2 waits for T1</text>

  <rect class="panel good" x="50" y="370" width="1100" height="325" rx="18"/>
  <text class="t" x="82" y="407">Ordered: conditionally try first, then repair the direction before sleeping</text>
  <text class="label" x="96" y="453">T1</text>
  <rect class="panel" x="140" y="425" width="180" height="70" rx="12"/><text class="s" x="170" y="454">hold B</text><text class="tiny" x="170" y="477">later page</text>
  <path class="line" d="M320 460h90"/><rect class="panel" x="410" y="425" width="210" height="70" rx="12"/><text class="s" x="438" y="454">try A conditionally</text><text class="tiny" x="438" y="477">conflict; still awake</text>
  <path class="line" d="M620 460h85"/><rect class="panel" x="705" y="425" width="170" height="70" rx="12"/><text class="s" x="740" y="454">release B</text><text class="tiny" x="730" y="477">before waiting</text>
  <path class="release" d="M790 495v62"/>
  <path class="line" d="M875 460h100"/><rect class="panel" x="975" y="425" width="130" height="70" rx="12"/><text class="s" x="1008" y="454">wait A</text><text class="tiny" x="996" y="477">holds no B</text>

  <text class="label" x="96" y="598">T2</text>
  <rect class="panel" x="140" y="565" width="180" height="70" rx="12"/><text class="s" x="170" y="594">hold A</text><text class="tiny" x="170" y="617">earlier page</text>
  <path class="line" d="M320 600h90"/><rect class="panel" x="410" y="565" width="210" height="70" rx="12"/><text class="s" x="438" y="594">try B conditionally</text><text class="tiny" x="438" y="617">then may wait holding A</text>
  <path class="line" d="M620 600h85"/><rect class="panel" x="705" y="565" width="170" height="70" rx="12"/><text class="s" x="733" y="594">obtain B</text><text class="tiny" x="728" y="617">after T1 release</text>
  <path class="line" d="M875 600h100"/><rect class="panel" x="975" y="565" width="130" height="70" rx="12"/><text class="s" x="1002" y="594">finish</text><text class="tiny" x="991" y="617">release A, B</text>

  <text class="s" x="292" y="731">Only a thread holding an earlier page may sleep for a later page; the wait-for cycle is gone.</text>
</svg>
