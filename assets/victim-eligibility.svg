<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">Hard victim predicates gate replacement policy</title>
  <desc id="desc">A sequence of text-labelled safety gates leads to a final protected recheck. Only candidates that pass reach replaceable LRU, quota, queue, and direct-assignment policy choices.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506875"/></marker><style>.bg{fill:#f7fafb;stroke:#d4dfe3;stroke-width:2}.g{fill:#fff2dc;stroke:#c9782d;stroke-width:2}.f{fill:#e6f5f1;stroke:#168d86;stroke-width:3}.p{fill:#edf1fb;stroke:#536eaf;stroke-width:2}.h{font:800 15px Inter,Arial,sans-serif;fill:#123a52;letter-spacing:1px}.t{font:700 15px Inter,Arial,sans-serif;fill:#173443}.s{font:13px Inter,Arial,sans-serif;fill:#526874}.l{fill:none;stroke:#506875;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect x="20" y="20" width="1120" height="430" rx="20" class="bg"/>
  <text x="50" y="58" class="h">HARD GATE</text>
  <rect x="50" y="85" width="190" height="75" rx="13" class="g"/><text x="145" y="116" text-anchor="middle" class="t">Identity stable</text><text x="145" y="140" text-anchor="middle" class="s">same VPID / mapping</text>
  <path d="M240 123H275" class="l"/><rect x="277" y="85" width="190" height="75" rx="13" class="g"/><text x="372" y="116" text-anchor="middle" class="t">No fix owner</text><text x="372" y="140" text-anchor="middle" class="s">fcnt and holders clear</text>
  <path d="M467 123H502" class="l"/><rect x="504" y="85" width="210" height="75" rx="13" class="g"/><text x="609" y="116" text-anchor="middle" class="t">Clean and not flushing</text><text x="609" y="140" text-anchor="middle" class="s">no in-flight generation</text>
  <path d="M714 123H749" class="l"/><rect x="751" y="85" width="235" height="75" rx="13" class="g"/><text x="869" y="116" text-anchor="middle" class="t">No waiters or transient claim</text><text x="869" y="140" text-anchor="middle" class="s">no hidden acquisition right</text>
  <path d="M869 160V210" class="l"/>
  <rect x="360" y="212" width="440" height="85" rx="15" class="f"/><text x="580" y="244" text-anchor="middle" class="h">FINAL PROTECTED RECHECK</text><text x="580" y="272" text-anchor="middle" class="s">lock BCB; revalidate flags, identity, ownership, zone, handoff</text>
  <path d="M580 297V345" class="l"/>
  <rect x="230" y="347" width="700" height="72" rx="14" class="p"/><text x="580" y="377" text-anchor="middle" class="h">POLICY CHOICE</text><text x="580" y="402" text-anchor="middle" class="s">LRU zone • private/shared domain • quota • candidate queue • revocable direct assignment</text>
  <text x="1010" y="113" class="t">FAIL</text><text x="1010" y="138" class="s">skip / retry</text>
</svg>
