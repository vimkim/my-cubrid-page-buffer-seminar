<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
  <title id="title">Three replacement policies as admission, reuse, and victim paths</title>
  <desc id="desc">CUBRID admits into private LRU1 or shared LRU2, boosts by zone and age, and selects clean eligible LRU3 pages. PostgreSQL gives a buffer usage count, increments it on reuse up to a cap, and clock-sweeps unpinned buffers while decrementing positive counts. InnoDB inserts reads at the head of its old sublist, conditionally promotes them to young after the old-block time, and evicts or flushes from the old tail.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#435d69"/></marker><style>.panel{fill:#fff;stroke:#c5d2d8;stroke-width:2}.cub{fill:#eef0ff;stroke:#5968bd;stroke-width:2}.pg{fill:#e9f4f3;stroke:#16847d;stroke-width:2}.my{fill:#fff6e8;stroke:#b86b22;stroke-width:2}.hot{fill:#fde9e5;stroke:#b74b3c;stroke-width:2}.t{font:700 26px Inter,Arial,sans-serif;fill:#173443}.h{font:700 19px Inter,Arial,sans-serif;fill:#173443}.s{font:14px Inter,Arial,sans-serif;fill:#526874}.tiny{font:12px Inter,Arial,sans-serif;fill:#526874}.line{fill:none;stroke:#435d69;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
  <text x="660" y="38" text-anchor="middle" class="t">Ask the same three questions: where admitted, what a hit changes, where evicted</text>
  <text x="165" y="82" text-anchor="middle" class="h">Engine</text><text x="430" y="82" text-anchor="middle" class="h">1 · Admission</text><text x="760" y="82" text-anchor="middle" class="h">2 · Reuse / aging</text><text x="1120" y="82" text-anchor="middle" class="h">3 · Candidate and dirty interaction</text>

  <rect x="30" y="105" rx="18" width="1260" height="190" class="cub"/>
  <text x="165" y="165" text-anchor="middle" class="h">CUBRID</text><text x="165" y="191" text-anchor="middle" class="tiny">sharded lists + 3 zones</text>
  <rect x="285" y="132" rx="11" width="290" height="120" class="panel"/><text x="430" y="166" text-anchor="middle" class="s">private context → LRU1 top</text><text x="430" y="195" text-anchor="middle" class="s">otherwise → shared LRU2 middle</text><text x="430" y="225" text-anchor="middle" class="tiny">AOUT disabled at pinned default</text>
  <rect x="615" y="132" rx="11" width="290" height="120" class="panel"/><text x="760" y="166" text-anchor="middle" class="s">LRU1 keep · old LRU2 boost</text><text x="760" y="195" text-anchor="middle" class="s">ordinary LRU3 hit → LRU1 top</text><text x="760" y="225" text-anchor="middle" class="tiny">quota adjusts zone thresholds</text>
  <rect x="945" y="132" rx="11" width="315" height="120" class="panel"/><text x="1102" y="166" text-anchor="middle" class="s">advertised list index → LRU3 scan</text><text x="1102" y="195" text-anchor="middle" class="s">clean + unfixed + protected recheck</text><text x="1102" y="225" text-anchor="middle" class="tiny">dirty candidate must be flushed first</text>

  <rect x="30" y="320" rx="18" width="1260" height="190" class="pg"/>
  <text x="165" y="380" text-anchor="middle" class="h">PostgreSQL</text><text x="165" y="406" text-anchor="middle" class="tiny">global clock hand + usage_count</text>
  <rect x="285" y="347" rx="11" width="290" height="120" class="panel"/><text x="430" y="381" text-anchor="middle" class="s">normal allocation sets usage_count</text><text x="430" y="410" text-anchor="middle" class="s">strategy ring may supply candidate</text><text x="430" y="440" text-anchor="middle" class="tiny">ring is workload-local reuse, not another cache</text>
  <rect x="615" y="347" rx="11" width="290" height="120" class="panel"/><text x="760" y="381" text-anchor="middle" class="s">pin hit increments usage_count</text><text x="760" y="410" text-anchor="middle" class="s">saturates at BM_MAX_USAGE_COUNT</text><text x="760" y="440" text-anchor="middle" class="tiny">clock later decrements positive values</text>
  <rect x="945" y="347" rx="11" width="315" height="120" class="panel"/><text x="1102" y="381" text-anchor="middle" class="s">clock: skip pinned</text><text x="1102" y="410" text-anchor="middle" class="s">decrement usage &gt; 0; choose 0</text><text x="1102" y="440" text-anchor="middle" class="tiny">dirty victim is written before reuse</text>

  <rect x="30" y="535" rx="18" width="1260" height="190" class="my"/>
  <text x="165" y="595" text-anchor="middle" class="h">MySQL / InnoDB</text><text x="165" y="621" text-anchor="middle" class="tiny">per-instance young / old LRU</text>
  <rect x="285" y="562" rx="11" width="290" height="120" class="panel"/><text x="430" y="596" text-anchor="middle" class="s">read page → old-sublist head</text><text x="430" y="625" text-anchor="middle" class="s">default old area ≈ 37%</text><text x="430" y="655" text-anchor="middle" class="tiny">midpoint exists only for long enough LRU</text>
  <rect x="615" y="562" rx="11" width="290" height="120" class="panel"/><text x="760" y="596" text-anchor="middle" class="s">eligible second access → young/MRU</text><text x="760" y="625" text-anchor="middle" class="s">default old-block delay = 1000 ms</text><text x="760" y="655" text-anchor="middle" class="tiny">filters one-pass scans from young area</text>
  <rect x="945" y="562" rx="11" width="315" height="120" class="panel"/><text x="1102" y="596" text-anchor="middle" class="s">candidate near old tail</text><text x="1102" y="625" text-anchor="middle" class="s">clean page frees; dirty page is flushed</text><text x="1102" y="655" text-anchor="middle" class="tiny">flush list tracks dirty order separately</text>

  <path d="M575 192 H607" class="line"/><path d="M905 192 H937" class="line"/><path d="M575 407 H607" class="line"/><path d="M905 407 H937" class="line"/><path d="M575 622 H607" class="line"/><path d="M905 622 H937" class="line"/>
  <rect x="210" y="750" rx="12" width="900" height="38" class="hot"/><text x="660" y="775" text-anchor="middle" class="h">Shared rule: pinned/fixed pages are not ordinary victims. Everything else is policy, not equivalence.</text>
</svg>
