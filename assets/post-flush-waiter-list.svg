<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
<title id="title">Flush completion removes only FLUSH waiters</title>
<desc id="desc">The BCB waiter list initially contains READ, FLUSH, WRITE and FLUSH entries. With the BCB mutex held, the completion helper unlinks and wakes the two FLUSH waiters. READ and WRITE remain for a separate access-granting helper.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526563"/></marker>
<style>.title{font:700 28px system-ui,sans-serif;fill:#172c2c}.head{font:700 24px system-ui,sans-serif;fill:#172c2c}.text{font:22px system-ui,sans-serif;fill:#172c2c}.note{font:19px system-ui,sans-serif;fill:#526563}.mono{font:21px ui-monospace,monospace;fill:#172c2c}.flow{fill:none;stroke:#526563;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="920" height="550" fill="#faf9f5"/>
<text class="title" x="28" y="43" text-anchor="start">Flush completion removes only FLUSH waiters</text>
<text class="note" x="28" y="74" text-anchor="start">Constructed source scenario · CUBRID f799e05 · Not a runtime observation</text>
<text class="head" x="28" y="120" text-anchor="start">Before: one BCB waiter list</text>
<rect x="28" y="146" width="192" height="80" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="46" y="180" text-anchor="start">READ</text>
<path class="flow" d="M220 187H250"/>
<rect x="252" y="146" width="192" height="80" rx="5" fill="#f8eee3" stroke="#ad5c16" stroke-width="2"/>
<text class="head" x="270" y="180" text-anchor="start">FLUSH</text>
<path class="flow" d="M444 187H474"/>
<rect x="476" y="146" width="192" height="80" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="494" y="180" text-anchor="start">WRITE</text>
<path class="flow" d="M668 187H698"/>
<rect x="700" y="146" width="192" height="80" rx="5" fill="#f8eee3" stroke="#ad5c16" stroke-width="2"/>
<text class="head" x="718" y="180" text-anchor="start">FLUSH</text>
<text class="head" x="28" y="302" text-anchor="start">After: access waiters remain</text>
<rect x="28" y="326" width="192" height="80" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="46" y="360" text-anchor="start">READ</text>
<rect x="300" y="326" width="192" height="80" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="318" y="360" text-anchor="start">WRITE</text>
<path class="flow" d="M220 367H298"/>
<text class="note" x="222" y="429" text-anchor="start">linked list</text>
<rect x="588" y="326" width="304" height="80" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="606" y="360" text-anchor="start">Wake both FLUSH</text>
<path class="flow" d="M348 230V276H740V322"/>
<text class="note" x="450" y="261" text-anchor="start">unlink and notify</text>
<path class="flow" d="M796 230V294H812V322"/>
<rect x="28" y="468" width="864" height="56" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="504" text-anchor="start">A wake grants no page access or frame reuse.</text>
</svg>
