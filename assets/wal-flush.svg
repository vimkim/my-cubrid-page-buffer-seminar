<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Dirty page WAL flush sequence</title><desc id="desc">memory mutation, dirty와 LSA, snapshot과 flushing, WAL force, DWB 또는 data volume write, concurrent re-dirty 보존</desc><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1558a6"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><g fill="#e8f1fc" stroke="#1558a6" stroke-width="2"><rect x="20" y="110" width="130" height="80" rx="12"/><rect x="185" y="110" width="130" height="80" rx="12"/><rect x="350" y="110" width="140" height="80" rx="12"/><rect x="525" y="110" width="130" height="80" rx="12"/><rect x="690" y="110" width="130" height="80" rx="12"/><rect x="855" y="110" width="125" height="80" rx="12"/></g><g font-size="16"><text x="85" y="140">writer mutation</text><text x="85" y="165">WRITE latch</text><text x="250" y="140">dirty + page LSA</text><text x="250" y="165">oldest LSA</text><text x="420" y="140">snapshot</text><text x="420" y="165">FLUSHING, clear dirty</text><text x="590" y="140">WAL force</text><text x="590" y="165">to snapshot LSA</text><text x="755" y="140">TDE / DWB</text><text x="755" y="165">or direct write</text><text x="917" y="140">completion</text><text x="917" y="165">clean or re-dirty</text></g></g><g fill="none" stroke="#1558a6" stroke-width="2" marker-end="url(#c)"><path d="M150 150H185"/><path d="M315 150H350"/><path d="M490 150H525"/><path d="M655 150H690"/><path d="M820 150H855"/><path d="M450 205C500 300 860 300 900 200" stroke="#9c2f2f"/></g><text x="670" y="285" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9c2f2f">I/O 중 writer가 다시 dirty → completion 뒤에도 DIRTY 유지</text></svg>
