<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Replacement structures from startup to pressure</title>
  <desc id="desc">At startup N BCBs form one singly linked invalid list while S shared and P private doubly linked LRU objects are empty. First unfix moves a BCB into exactly one LRU. Under pressure the invalid list may be empty, zones contain resident BCBs, and victimizers consume one advertised LRU index rather than scanning all private lists.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#435d69"/></marker>
    <style>
      .panel{fill:#fff;stroke:#c5d2d8;stroke-width:2}.free{fill:#eef0ff;stroke:#5968bd;stroke-width:2}.hot{fill:#fde9e5;stroke:#b74b3c;stroke-width:2}.buffer{fill:#fff6e8;stroke:#b86b22;stroke-width:2}.victim{fill:#e9f4f3;stroke:#16847d;stroke-width:2}.note{fill:#f7f8f9;stroke:#6b7780;stroke-width:2}.t{font:700 26px Inter,Arial,sans-serif;fill:#173443}.h{font:700 19px Inter,Arial,sans-serif;fill:#173443}.s{font:15px Inter,Arial,sans-serif;fill:#526874}.tiny{font:13px Inter,Arial,sans-serif;fill:#526874}.line{fill:none;stroke:#435d69;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="38" text-anchor="middle" class="t">The same fixed objects, three different moments</text>

  <rect x="35" y="75" rx="18" width="1210" height="190" class="panel"/>
  <text x="65" y="112" class="h">1 · Initialization</text>
  <rect x="70" y="135" rx="12" width="455" height="93" class="free"/>
  <text x="297" y="165" text-anchor="middle" class="h">invalid_top → BCB 0 → BCB 1 → … → BCB N−1</text>
  <text x="297" y="196" text-anchor="middle" class="s">one singly linked list · invalid_cnt = N</text>
  <rect x="605" y="128" rx="12" width="285" height="105" class="note"/>
  <text x="747" y="158" text-anchor="middle" class="h">S shared LRU objects</text>
  <text x="747" y="187" text-anchor="middle" class="s">top = bottom = NULL</text>
  <text x="747" y="213" text-anchor="middle" class="tiny">all zone counts = 0</text>
  <rect x="925" y="128" rx="12" width="285" height="105" class="note"/>
  <text x="1067" y="158" text-anchor="middle" class="h">P private LRU objects</text>
  <text x="1067" y="187" text-anchor="middle" class="s">allocated now, not per fix</text>
  <text x="1067" y="213" text-anchor="middle" class="tiny">contexts are assigned later</text>

  <rect x="35" y="295" rx="18" width="1210" height="215" class="panel"/>
  <text x="65" y="333" class="h">2 · First use and first zero-crossing unfix</text>
  <rect x="70" y="365" rx="12" width="250" height="92" class="free"/>
  <text x="195" y="399" text-anchor="middle" class="h">pop invalid head</text>
  <text x="195" y="429" text-anchor="middle" class="s">O(1), invalid_cnt − 1</text>
  <path d="M320 411 H405" class="line"/>
  <rect x="415" y="350" rx="12" width="355" height="122" class="note"/>
  <text x="592" y="383" text-anchor="middle" class="h">load page + fix</text>
  <text x="592" y="414" text-anchor="middle" class="s">BCB is resident but in VOID zone</text>
  <text x="592" y="443" text-anchor="middle" class="tiny">a fixed page is not linked into an LRU yet</text>
  <path d="M770 411 H855" class="line"/>
  <rect x="865" y="342" rx="12" width="345" height="138" class="hot"/>
  <text x="1037" y="376" text-anchor="middle" class="h">join exactly one doubly linked LRU</text>
  <text x="1037" y="408" text-anchor="middle" class="s">enabled private assignment → S+p LRU1 top</text>
  <text x="1037" y="438" text-anchor="middle" class="s">otherwise → shared LRU2 middle</text>
  <text x="1037" y="465" text-anchor="middle" class="tiny">default AOUT-disabled path</text>

  <rect x="35" y="540" rx="18" width="1210" height="275" class="panel"/>
  <text x="65" y="578" class="h">3 · Sustained pressure</text>
  <rect x="70" y="610" rx="12" width="205" height="85" class="free"/>
  <text x="172" y="643" text-anchor="middle" class="h">invalid list</text>
  <text x="172" y="673" text-anchor="middle" class="s">may be empty</text>
  <rect x="325" y="600" rx="12" width="245" height="105" class="hot"/>
  <text x="447" y="634" text-anchor="middle" class="h">LRU1</text>
  <text x="447" y="663" text-anchor="middle" class="s">hot · non-victim</text>
  <text x="447" y="691" text-anchor="middle" class="tiny">private target = 5% quota</text>
  <rect x="590" y="600" rx="12" width="245" height="105" class="buffer"/>
  <text x="712" y="634" text-anchor="middle" class="h">LRU2</text>
  <text x="712" y="663" text-anchor="middle" class="s">buffer · non-victim</text>
  <text x="712" y="691" text-anchor="middle" class="tiny">private target = 5% quota</text>
  <rect x="855" y="600" rx="12" width="355" height="105" class="victim"/>
  <text x="1032" y="634" text-anchor="middle" class="h">LRU3</text>
  <text x="1032" y="663" text-anchor="middle" class="s">remaining resident pages · victim scan zone</text>
  <text x="1032" y="691" text-anchor="middle" class="tiny">one selected list, at most 1,000 nodes per scan</text>
  <rect x="230" y="740" rx="12" width="820" height="50" class="note"/>
  <text x="640" y="771" text-anchor="middle" class="h">Queue yields one LRU index → lock one list → scan its LRU3; no 2,000-context sweep</text>
</svg>
