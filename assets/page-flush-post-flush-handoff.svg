<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Page flush conditionally hands BCB completion to post-flush</title>
  <desc id="desc">Allocator pressure wakes page flush, which scans cold dirty pages, rechecks state, respects WAL, and submits a stable generation. Four conditions decide whether only a BCB control-record pointer enters the bounded post-flush queue or the submitting caller completes the remaining in-memory bookkeeping locally. No page bytes enter the queue and post-flush starts no new write.</desc>
  <defs><style>.bg{fill:#faf9f5}.box{fill:#fff;stroke:#ccd7d1;stroke-width:2}.blue{fill:#e7f0e9;stroke:#006b59}.green{fill:#e7f0e9;stroke:#006b59}.orange{fill:#f8eee3;stroke:#ad5c16}.red{fill:#f8eee3;stroke:#ad5c16}.h{font:700 27px system-ui,sans-serif;fill:#172c2c}.t{font:700 17px system-ui,sans-serif;fill:#172c2c}.s{font:14px system-ui,sans-serif;fill:#526563}.tiny{font:13px system-ui,sans-serif;fill:#526563}.arrow{stroke:#526563;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526563"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="3"/><text class="h" x="50" y="55">Only page-flush and post-flush form a direct producer–consumer pair</text>
  <rect class="box orange" x="55" y="100" width="200" height="90" rx="3"/><text class="t" x="90" y="135">Allocator waits</text><text class="s" x="90" y="165">wake page-flush</text><path class="arrow" d="M255 145h55"/>
  <rect class="box blue" x="310" y="90" width="320" height="110" rx="3"/><text class="t" x="345" y="125">pgbuf-page-flush</text><text class="s" x="345" y="155">scan LRU3 → protected recheck</text><text class="s" x="345" y="180">WAL → DWB/direct submission</text><path class="arrow" d="M630 145h55"/>
  <rect class="box" x="685" y="80" width="460" height="150" rx="3"/><text class="t" x="720" y="115">Handoff requires all four</text><text class="s" x="720" y="145">1 · producer is page-flush</text><text class="s" x="720" y="170">2 · post-flush daemon exists</text><text class="s" x="930" y="145">3 · allocator is waiting</text><text class="s" x="930" y="170">4 · queue accepts BCB*</text><text class="tiny" x="720" y="203">What moves: one PGBUF_BCB* only · capacity: 8,192</text>
  <path class="arrow" d="M915 230v70"/><rect class="box green" x="665" y="300" width="500" height="165" rx="3"/><text class="t" x="700" y="337">pgbuf-page-post-flush drains queue</text><text class="s" x="700" y="370">lock BCB and recheck clean · unfixed · LRU3 · quota</text><text class="s" x="700" y="401">if eligible, offer BCB to one live allocator</text><text class="s" x="700" y="432">always clear old FLUSHING · wake flush waiters</text>
  <path class="arrow" d="M685 205c-180 75-195 220-130 315"/><rect class="box red" x="55" y="500" width="500" height="145" rx="3"/><text class="t" x="90" y="537">Any condition is false or queue is full</text><text class="s" x="90" y="570">submitting caller completes BCB locally:</text><text class="s" x="90" y="600">clear old FLUSHING + wake flush waiters</text><text class="tiny" x="90" y="627">Post-flush starts no new page write.</text>
  <path class="arrow" d="M915 465v80"/><rect class="box green" x="665" y="545" width="500" height="100" rx="3"/><text class="t" x="700" y="582">Allocator wakes; offer may be revoked</text><text class="s" x="700" y="613">only if the protected recheck still authorizes reuse</text>
  <text class="tiny" x="205" y="690">No page bytes cross this queue. DWB acceptance may precede home-volume write; this completes page-buffer state, not universal durability.</text>
</svg>
