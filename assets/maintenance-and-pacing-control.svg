<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance and flush control are separate policy and pacing planes</title>
  <desc id="desc">The maintenance lane turns unfix and hit samples into quota and zone policy. The flush-control lane turns completed write demand and elapsed time into a replacement token budget and condition broadcast. Neither lane receives or writes a BCB page image.</desc>
  <defs><style>.bg{fill:#f7f5ef}.box{fill:#fff;stroke:#26384a;stroke-width:2}.blue{fill:#eaf3ff;stroke:#2563a8}.orange{fill:#fff3dc;stroke:#a86413}.green{fill:#eaf8ef;stroke:#287a45}.h{font:700 27px system-ui,sans-serif;fill:#172331}.t{font:700 18px system-ui,sans-serif;fill:#172331}.s{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.arrow{stroke:#526273;stroke-width:3;fill:none;marker-end:url(#m)}.divide{stroke:#8a96a3;stroke-width:2;stroke-dasharray:8 7}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526273"/></marker></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="h" x="50" y="55">Two control planes influence later work without carrying page images</text>
  <text class="t" x="75" y="115">REPLACEMENT POLICY · pgbuf-maintain</text>
  <rect class="box blue" x="65" y="145" width="230" height="105" rx="15"/><text class="s" x="95" y="180">unfix shards</text><text class="s" x="95" y="207">LRU hit counters</text><text class="tiny" x="95" y="232">100 ms attempts</text><path class="arrow" d="M295 198h65"/>
  <rect class="box orange" x="360" y="145" width="280" height="105" rx="15"/><text class="s" x="390" y="180">admission check</text><text class="s" x="390" y="207">quota/activity smoothing</text><text class="tiny" x="390" y="232">may reject this attempt</text><path class="arrow" d="M640 198h65"/>
  <rect class="box green" x="705" y="145" width="425" height="105" rx="15"/><text class="s" x="735" y="180">new quotas and LRU1/LRU2 thresholds</text><text class="s" x="735" y="207">zone demotion + victim-rich signal</text><text class="tiny" x="735" y="232">later observed by replacement/page-flush policy</text>
  <line class="divide" x1="65" y1="315" x2="1135" y2="315"/><text class="tiny" x="415" y="305">No BCB pointer or page image crosses this divider</text>
  <text class="t" x="75" y="365">POST-WRITE PACING · pgbuf-flush-control</text>
  <rect class="box blue" x="65" y="395" width="230" height="105" rx="15"/><text class="s" x="95" y="430">completed OS writes</text><text class="s" x="95" y="457">consumed-token demand</text><text class="tiny" x="95" y="482">pacing happens after write</text><path class="arrow" d="M295 448h65"/>
  <rect class="box orange" x="360" y="395" width="280" height="105" rx="15"/><text class="s" x="390" y="430">elapsed-time feedback</text><text class="s" x="390" y="457">replace token budget</text><text class="tiny" x="390" y="482">50 ms start-to-start target</text><path class="arrow" d="M640 448h65"/>
  <rect class="box green" x="705" y="395" width="425" height="105" rx="15"/><text class="s" x="735" y="430">broadcast waiting writers</text><text class="s" x="735" y="457">pace their subsequent progress</text><text class="tiny" x="735" y="482">soft limit: bypass and retry bounds exist</text>
  <rect class="box" x="170" y="555" width="860" height="80" rx="15"/><text class="t" x="230" y="588">Neither daemon selects a dirty BCB or starts page-image I/O</text><text class="s" x="230" y="616">Maintenance changes policy; flush-control refreshes a shared pacing budget.</text>
</svg>
