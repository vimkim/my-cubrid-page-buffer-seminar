<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Holder list, watcher chains, and temporary ordered-fix array</title>
  <desc id="desc">A thread holder list aggregates ownership by BCB, watcher chains preserve one receipt per ordered fix, and a separate temporary array copies ordering metadata and is sorted. The holder list itself is not kept in canonical page order.</desc>
  <defs><style>.bg{fill:#f7f5ef}.box{fill:#fff;stroke:#26384a;stroke-width:2}.holder{fill:#eaf3ff;stroke:#2563a8}.watch{fill:#fff3dc;stroke:#a86413}.temp{fill:#eaf8ef;stroke:#287a45}.h{font:700 27px system-ui,sans-serif;fill:#172331}.t{font:700 18px system-ui,sans-serif;fill:#172331}.s{font:15px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.arrow{stroke:#526273;stroke-width:2.5;fill:none;marker-end:url(#m)}.dash{stroke-dasharray:7 6}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526273"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/><text class="h" x="52" y="52">Ordering metadata lives beside the holder list, then moves into a temporary array</text>
  <rect class="box" x="50" y="85" width="1100" height="185" rx="18"/><text class="t" x="80" y="122">Layer 1 · thread holder list — aggregate ownership, head-inserted order</text>
  <rect class="box holder" x="105" y="160" width="260" height="76" rx="13"/><text class="s" x="134" y="190">holder for BCB N120</text><text class="tiny" x="134" y="215">fix_count=2 · watch_count=2</text>
  <path class="arrow" d="M365 198h95"/><rect class="box holder" x="460" y="160" width="260" height="76" rx="13"/><text class="s" x="489" y="190">holder for BCB H</text><text class="tiny" x="489" y="215">fix_count=1 · watch_count=1</text>
  <path class="arrow" d="M720 198h95"/><rect class="box holder" x="815" y="160" width="220" height="76" rx="13"/><text class="s" x="844" y="190">holder for BCB X</text><text class="tiny" x="844" y="215">list position ≠ rank</text>

  <rect class="box" x="50" y="300" width="1100" height="180" rx="18"/><text class="t" x="80" y="337">Layer 2 · watcher chains — one movable receipt per ordered fix</text>
  <path class="arrow" d="M235 270v68"/><rect class="box watch" x="100" y="370" width="260" height="78" rx="13"/><text class="s" x="126" y="400">watcher N120 #1 ↔ #2</text><text class="tiny" x="126" y="425">group · rank · latch · pgptr</text>
  <path class="arrow" d="M590 270v68"/><rect class="box watch" x="455" y="370" width="260" height="78" rx="13"/><text class="s" x="481" y="400">watcher H</text><text class="tiny" x="481" y="425">page_was_unfixed report</text>
  <rect class="box watch" x="810" y="370" width="260" height="78" rx="13"/><text class="s" x="836" y="400">unwatched holder</text><text class="tiny" x="836" y="425">not reconstructable by slow path</text>

  <path class="arrow dash" d="M360 410h80v122h100"/><path class="arrow dash" d="M715 410h80v122h-100"/>
  <rect class="box temp" x="225" y="535" width="750" height="125" rx="18"/><text class="t" x="255" y="570">Layer 3 · temporary PGBUF_HOLDER_INFO array</text>
  <text class="s" x="255" y="603">copy (group, rank, VPID, latch, watcher pointers) → qsort()</text>
  <text class="s" x="255" y="630">unconditional fix sequence: request N100 → released N120 → …</text>
  <text class="tiny" x="379" y="689">Canonical order governs reacquisition; it never rearranges the permanent holder linked list.</text>
</svg>
