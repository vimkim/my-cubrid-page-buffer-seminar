<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">How one LRU3 BCB becomes a victim or is skipped</title>
  <desc id="desc">The selected-list scan considers only an LRU3 BCB. Cheap checks skip dirty, flushing, direct-victim, fixed, waiter-bearing, or transiently latched BCBs. A nonblocking BCB mutex try-lock may also skip it. Only a successful protected recheck permits unlinking the BCB to the void zone and later deleting the old hash mapping for rebinding. Every failed branch keeps the old resident identity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#48626f"/></marker>
    <style>
      .bg{fill:#f8fafb;stroke:#cbd7dc;stroke-width:2}.step{fill:#fff;stroke:#667c87;stroke-width:2}.policy{fill:#edf0ff;stroke:#5968bd;stroke-width:2.5}.reject{fill:#fbe9e7;stroke:#b3452f;stroke-width:2}.ok{fill:#e7f5f2;stroke:#16847d;stroke-width:2.5}.void{fill:#fff3df;stroke:#b86b22;stroke-width:2.5}.title{font:800 27px Inter,Arial,sans-serif;fill:#173443}.h{font:750 17px Inter,Arial,sans-serif;fill:#173443}.s{font:14px Inter,Arial,sans-serif;fill:#526874}.tiny{font:13px Inter,Arial,sans-serif;fill:#526874}.line{fill:none;stroke:#48626f;stroke-width:2.5;marker-end:url(#arrow)}.no{fill:none;stroke:#b3452f;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="38" text-anchor="middle" class="title">One BCB: nomination is cheap; reuse authority comes last</text>
  <rect x="25" y="70" width="1230" height="705" rx="22" class="bg"/>

  <rect x="70" y="108" width="330" height="78" rx="14" class="policy"/>
  <text x="235" y="138" text-anchor="middle" class="h">1 · Selected list, LRU3 only</text>
  <text x="235" y="164" text-anchor="middle" class="s">start at victim_hint or bottom</text>
  <path d="M235 186V225" class="line"/>

  <rect x="70" y="228" width="330" height="122" rx="14" class="step"/>
  <text x="235" y="258" text-anchor="middle" class="h">2 · Cheap flag check</text>
  <text x="235" y="285" text-anchor="middle" class="s">DIRTY? FLUSHING?</text>
  <text x="235" y="310" text-anchor="middle" class="s">direct-victim assigned/invalidated?</text>
  <text x="235" y="335" text-anchor="middle" class="tiny">pgbuf_bcb_avoid_victim()</text>
  <path d="M400 289H500" class="no"/>
  <text x="450" y="273" text-anchor="middle" class="tiny">any flag set</text>
  <rect x="510" y="244" width="310" height="90" rx="14" class="reject"/>
  <text x="665" y="278" text-anchor="middle" class="h">SKIP · keep old identity</text>
  <text x="665" y="306" text-anchor="middle" class="s">dirty pages need flush progress</text>
  <path d="M235 350V390" class="line"/>

  <rect x="70" y="393" width="330" height="122" rx="14" class="step"/>
  <text x="235" y="423" text-anchor="middle" class="h">3 · Cheap ownership check</text>
  <text x="235" y="450" text-anchor="middle" class="s">fcnt &gt; 0? waiter list nonempty?</text>
  <text x="235" y="475" text-anchor="middle" class="s">unprotected latch mode not NO_LATCH?</text>
  <text x="235" y="500" text-anchor="middle" class="tiny">pgbuf_is_bcb_fixed_by_any(..., false)</text>
  <path d="M400 454H500" class="no"/>
  <text x="450" y="438" text-anchor="middle" class="tiny">any owner/right</text>
  <rect x="510" y="409" width="310" height="90" rx="14" class="reject"/>
  <text x="665" y="443" text-anchor="middle" class="h">SKIP · caller still wins</text>
  <text x="665" y="471" text-anchor="middle" class="s">the scanner never steals a fixed BCB</text>
  <path d="M235 515V555" class="line"/>

  <rect x="70" y="558" width="330" height="92" rx="14" class="step"/>
  <text x="235" y="589" text-anchor="middle" class="h">4 · Try-lock BCB mutex</text>
  <text x="235" y="616" text-anchor="middle" class="s">nonblocking while LRU mutex is held</text>
  <text x="235" y="638" text-anchor="middle" class="tiny">PGBUF_BCB_TRYLOCK()</text>
  <path d="M400 604H500" class="no"/>
  <text x="450" y="588" text-anchor="middle" class="tiny">busy</text>
  <rect x="510" y="559" width="310" height="90" rx="14" class="reject"/>
  <text x="665" y="593" text-anchor="middle" class="h">SKIP · no lock convoy</text>
  <text x="665" y="621" text-anchor="middle" class="s">continue toward newer LRU3 nodes</text>

  <path d="M235 650V705H885" class="line"/>
  <rect x="845" y="244" width="340" height="155" rx="14" class="ok"/>
  <text x="1015" y="278" text-anchor="middle" class="h">5 · Protected recheck</text>
  <text x="1015" y="306" text-anchor="middle" class="s">repeat flags + ownership checks</text>
  <text x="1015" y="332" text-anchor="middle" class="s">while LRU and BCB state are guarded</text>
  <text x="1015" y="359" text-anchor="middle" class="tiny">pgbuf_is_bcb_victimizable(..., true)</text>
  <text x="1015" y="382" text-anchor="middle" class="tiny">failure still means SKIP</text>
  <path d="M1015 399V465" class="line"/>
  <rect x="845" y="468" width="340" height="105" rx="14" class="void"/>
  <text x="1015" y="501" text-anchor="middle" class="h">6 · Unlink → VOID</text>
  <text x="1015" y="529" text-anchor="middle" class="s">old resident is detached, BCB mutex held</text>
  <text x="1015" y="554" text-anchor="middle" class="tiny">pgbuf_remove_from_lru_list()</text>
  <path d="M1015 573V625" class="line"/>
  <rect x="845" y="628" width="340" height="105" rx="14" class="ok"/>
  <text x="1015" y="661" text-anchor="middle" class="h">7 · Victimize and rebind</text>
  <text x="1015" y="689" text-anchor="middle" class="s">delete old hash mapping; load new VPID</text>
  <text x="1015" y="714" text-anchor="middle" class="tiny">pgbuf_victimize_bcb() → claim/load path</text>

  <path d="M820 705H835V322H845" class="line"/>
  <text x="616" y="696" text-anchor="middle" class="s">try-lock success</text>
  <text x="616" y="718" text-anchor="middle" class="tiny">at most 1,000 LRU3 node visits per selected-list call</text>
</svg>
