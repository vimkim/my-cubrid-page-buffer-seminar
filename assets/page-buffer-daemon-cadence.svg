<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The four page-buffer daemons have different cadence and wake rules</title>
  <desc id="desc">Maintenance attempts every 100 milliseconds but may reject a quota epoch. Page flush uses a default one-second timer and demand wakes. Post-flush backs off through one, ten, and one hundred milliseconds into wake-only sleep. Flush control targets fifty milliseconds and its first active pass only records time.</desc>
  <defs><style>.bg{fill:#f7f5ef}.row{fill:#fff;stroke:#26384a;stroke-width:2}.blue{fill:#eaf3ff;stroke:#2563a8}.green{fill:#eaf8ef;stroke:#287a45}.orange{fill:#fff3dc;stroke:#a86413}.h{font:700 27px system-ui,sans-serif;fill:#172331}.t{font:700 17px system-ui,sans-serif;fill:#172331}.s{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.line{stroke:#526273;stroke-width:3;fill:none}.wake{stroke:#287a45;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#287a45"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/><text class="h" x="50" y="55">A timer grants an execution opportunity; each task may still do no useful work</text>
  <rect class="row" x="45" y="90" width="1110" height="125" rx="16"/><text class="t" x="75" y="125">pgbuf-maintain</text><path class="line" d="M245 155h835"/>
  <circle class="orange" cx="310" cy="155" r="15"/><circle class="orange" cx="445" cy="155" r="15"/><circle class="orange" cx="580" cy="155" r="15"/><circle class="green" cx="715" cy="155" r="15"/><circle class="orange" cx="850" cy="155" r="15"/><text class="s" x="285" y="195">100 ms attempts · accepted quota epoch may wait for activity or about 500 ms</text>
  <rect class="row" x="45" y="230" width="1110" height="125" rx="16"/><text class="t" x="75" y="265">pgbuf-page-flush</text><path class="line" d="M245 295h835"/>
  <circle class="orange" cx="480" cy="295" r="15"/><circle class="orange" cx="900" cy="295" r="15"/><path class="wake" d="M330 345v-35"/><text class="s" x="250" y="345">demand wake</text><text class="s" x="540" y="335">default 1,000 ms timer · interval 0 means wake-only</text><text class="tiny" x="540" y="315">timed pass may submit zero pages</text>
  <rect class="row" x="45" y="370" width="1110" height="125" rx="16"/><text class="t" x="75" y="405">pgbuf-page-post-flush</text><path class="line" d="M275 435h770"/>
  <circle class="green" cx="345" cy="435" r="15"/><text class="s" x="328" y="476">1</text><circle class="orange" cx="500" cy="435" r="15"/><text class="s" x="475" y="476">10</text><circle class="orange" cx="655" cy="435" r="15"/><text class="s" x="625" y="476">100</text><rect class="orange" x="780" y="412" width="205" height="48" rx="12"/><text class="s" x="820" y="442">wake-only sleep</text><path class="wake" d="M1050 485c0 70-705 70-705-25"/><text class="tiny" x="610" y="545">queue work or early wake resets backoff to 1 ms</text>
  <rect class="row" x="45" y="565" width="1110" height="105" rx="16"/><text class="t" x="75" y="600">pgbuf-flush-control</text><path class="line" d="M275 625h770"/><circle class="orange" cx="380" cy="625" r="15"/><circle class="green" cx="570" cy="625" r="15"/><circle class="green" cx="760" cy="625" r="15"/><circle class="green" cx="950" cy="625" r="15"/><text class="tiny" x="300" y="655">first gate-open pass timestamps; later 50 ms targets replace tokens and broadcast</text>
  <text class="tiny" x="260" y="700">Periods are start-to-start targets: previous task time is subtracted, and scheduler/lock/I/O delay still applies.</text>
</svg>
