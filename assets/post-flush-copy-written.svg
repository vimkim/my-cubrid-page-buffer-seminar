<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
<title id="title">Write success leaves the page in memory</title>
<desc id="desc">The page copy was accepted by the write path. The resident page is clean, but its BCB still has FLUSHING set. The allocator is still waiting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526563"/></marker>
<style>.title{font:700 28px system-ui,sans-serif;fill:#172c2c}.head{font:700 24px system-ui,sans-serif;fill:#172c2c}.text{font:22px system-ui,sans-serif;fill:#172c2c}.note{font:19px system-ui,sans-serif;fill:#526563}.mono{font:21px ui-monospace,monospace;fill:#172c2c}.flow{fill:none;stroke:#526563;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="920" height="470" fill="#faf9f5"/>
<text class="title" x="28" y="43" text-anchor="start">Write success leaves the page in memory</text>
<text class="note" x="28" y="74" text-anchor="start">Constructed source scenario · CUBRID f799e05 · Not a runtime observation</text>
<rect x="28" y="110" width="360" height="164" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="46" y="144" text-anchor="start">Resident memory slot</text>
<text class="text" x="46" y="180" text-anchor="start">Page P is still here</text>
<text class="text" x="46" y="210" text-anchor="start">Clean: no later changes</text>
<text class="text" x="46" y="240" text-anchor="start">BCB: FLUSHING = 1</text>
<rect x="542" y="110" width="350" height="164" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="560" y="144" text-anchor="start">Write path</text>
<text class="text" x="560" y="180" text-anchor="start">Copied contents accepted</text>
<text class="text" x="560" y="210" text-anchor="start">Write call succeeded</text>
<text class="text" x="560" y="240" text-anchor="start">Final durability unproven</text>
<path class="flow" d="M388 190H540"/>
<text class="note" x="420" y="170" text-anchor="start">send copy</text>
<rect x="28" y="308" width="864" height="60" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="46" y="342" text-anchor="start">Allocator: still waiting for a slot</text>
<rect x="28" y="388" width="864" height="56" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="424" text-anchor="start">Write finished; completion and frame receipt remain.</text>
</svg>
