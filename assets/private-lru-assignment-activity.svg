<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Private LRU assignment and activity feedback</title>
  <desc id="desc">Private LRU assignment scans all private descriptors, preferring an unassigned list with the fewest BCBs and otherwise the least-active list. It atomically increments the session count and returns a private-local index. The executing thread carries this index, while BCB membership uses the full shared-plus-private array index. Final unfix records at most one hit per BCB per adjustment epoch; an accepted quota adjustment converts hits to a per-second rate, smooths private activity over ten seconds, and distributes private quota in proportion to activity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#48626f"/></marker>
    <style>
      .panel{fill:#f8fafb;stroke:#cbd7dc;stroke-width:2}.context{fill:#edf0ff;stroke:#5968bd;stroke-width:2.5}.choice{fill:#fff3df;stroke:#b86b22;stroke-width:2.5}.list{fill:#e7f5f2;stroke:#16847d;stroke-width:2.5}.counter{fill:#fff;stroke:#667c87;stroke-width:2}.formula{fill:#f4effb;stroke:#7955a6;stroke-width:2}.warn{fill:#fbe9e7;stroke:#b3452f;stroke-width:2}.title{font:800 27px Inter,Arial,sans-serif;fill:#173443}.h{font:750 18px Inter,Arial,sans-serif;fill:#173443}.s{font:14px Inter,Arial,sans-serif;fill:#526874}.tiny{font:13px Inter,Arial,sans-serif;fill:#526874}.line{fill:none;stroke:#48626f;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#6f7880;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="38" text-anchor="middle" class="title">A context borrows an index; final-unfix samples decide future quota</text>

  <rect x="30" y="70" width="1220" height="350" rx="22" class="panel"/>
  <text x="60" y="106" class="h">A · Assign one private LRU to a session or vacuum context</text>
  <rect x="65" y="135" width="245" height="105" rx="15" class="context"/>
  <text x="187" y="168" text-anchor="middle" class="h">New context</text>
  <text x="187" y="197" text-anchor="middle" class="s">pgbuf_assign_private_lru()</text>
  <text x="187" y="222" text-anchor="middle" class="tiny">quota disabled → return −1</text>
  <path d="M310 188H380" class="line"/>
  <rect x="390" y="125" width="390" height="130" rx="15" class="choice"/>
  <text x="585" y="158" text-anchor="middle" class="h">Scan all P private descriptors · O(P)</text>
  <text x="585" y="188" text-anchor="middle" class="s">priority 1: session_cnt = 0, smallest BCB count</text>
  <text x="585" y="216" text-anchor="middle" class="s">otherwise: smallest monitor.lru_activity</text>
  <text x="585" y="240" text-anchor="middle" class="tiny">ties keep the first index encountered</text>
  <path d="M780 188H850" class="line"/>
  <rect x="860" y="125" width="335" height="130" rx="15" class="list"/>
  <text x="1027" y="158" text-anchor="middle" class="h">Reserve and return p</text>
  <text x="1027" y="188" text-anchor="middle" class="s">atomic session_cnt[p]++</text>
  <text x="1027" y="216" text-anchor="middle" class="s">idle candidate stolen? retry up to 5 times</text>
  <text x="1027" y="240" text-anchor="middle" class="tiny">returned p is private-local: 0 … P−1</text>

  <rect x="170" y="300" width="300" height="78" rx="14" class="context"/>
  <text x="320" y="330" text-anchor="middle" class="h">THREAD_ENTRY.private_lru_index = p</text>
  <text x="320" y="355" text-anchor="middle" class="tiny">copied while that context executes</text>
  <path d="M470 339H555" class="line"/>
  <rect x="565" y="290" width="360" height="98" rx="14" class="formula"/>
  <text x="745" y="321" text-anchor="middle" class="h">full LRU index = S + p</text>
  <text x="745" y="349" text-anchor="middle" class="s">shared indices: 0 … S−1</text>
  <text x="745" y="373" text-anchor="middle" class="s">private indices: S … S+P−1</text>
  <path d="M925 339H1010" class="line"/>
  <rect x="1020" y="300" width="175" height="78" rx="14" class="list"/>
  <text x="1107" y="330" text-anchor="middle" class="h">BCB membership</text>
  <text x="1107" y="355" text-anchor="middle" class="tiny">flags store full index</text>

  <rect x="30" y="450" width="1220" height="400" rx="22" class="panel"/>
  <text x="60" y="486" class="h">B · Measure activity and turn it into the next private quota</text>
  <rect x="65" y="520" width="280" height="120" rx="15" class="counter"/>
  <text x="205" y="553" text-anchor="middle" class="h">Ordinary final unfix</text>
  <text x="205" y="581" text-anchor="middle" class="s">if hit_age &lt; adjust_age</text>
  <text x="205" y="607" text-anchor="middle" class="s">lru_hits[full_index]++</text>
  <text x="205" y="630" text-anchor="middle" class="tiny">one BCB hit at most once per epoch</text>
  <path d="M345 580H420" class="line"/>
  <rect x="430" y="505" width="390" height="150" rx="15" class="choice"/>
  <text x="625" y="538" text-anchor="middle" class="h">Accepted pgbuf_adjust_quotas()</text>
  <text x="625" y="567" text-anchor="middle" class="s">take and reset hits with ATOMIC_TAS_32</text>
  <text x="625" y="594" text-anchor="middle" class="s">rate = 1,000,000 × hits / elapsed_usec</text>
  <text x="625" y="621" text-anchor="middle" class="s">smooth old rate and new rate over 10 seconds</text>
  <text x="625" y="645" text-anchor="middle" class="tiny">only an accepted pass increments adjust_age</text>
  <path d="M820 580H895" class="line"/>
  <rect x="905" y="505" width="290" height="150" rx="15" class="formula"/>
  <text x="1050" y="538" text-anchor="middle" class="h">monitor.lru_activity[i]</text>
  <text x="1050" y="567" text-anchor="middle" class="s">private share = activity[i] / Σ activity</text>
  <text x="1050" y="594" text-anchor="middle" class="s">quota = share × all-private target</text>
  <text x="1050" y="621" text-anchor="middle" class="s">cap: min(5,000, N/2)</text>
  <text x="1050" y="645" text-anchor="middle" class="tiny">LRU1 and LRU2 thresholds = 5% each</text>

  <rect x="65" y="705" width="535" height="105" rx="15" class="warn"/>
  <text x="332" y="738" text-anchor="middle" class="h">Release is not a drain</text>
  <text x="332" y="766" text-anchor="middle" class="s">session_cnt[p]-- ; if it reaches zero, activity[S+p] = 0</text>
  <text x="332" y="791" text-anchor="middle" class="tiny">the LRU object and its resident BCBs remain</text>
  <rect x="680" y="705" width="515" height="105" rx="15" class="counter"/>
  <text x="937" y="738" text-anchor="middle" class="h">No private assignment</text>
  <text x="937" y="766" text-anchor="middle" class="s">new BCB uses shared round-robin; periodic O(S) balance scan</text>
  <text x="937" y="791" text-anchor="middle" class="tiny">victim search later consumes advertised list indices instead</text>
  <path d="M1050 655C1050 685 940 682 940 695" class="dash"/>
</svg>
