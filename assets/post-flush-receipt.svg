<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
<title id="title">Receipt checks precede a new page identity</title>
<desc id="desc">The allocator locks the BCB, checks revocation and current eligibility, removes it from replacement lists, and returns it locked. The allocation path then removes the old page lookup mapping before claiming a new identity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526563"/></marker>
<style>.title{font:700 28px system-ui,sans-serif;fill:#172c2c}.head{font:700 24px system-ui,sans-serif;fill:#172c2c}.text{font:22px system-ui,sans-serif;fill:#172c2c}.note{font:19px system-ui,sans-serif;fill:#526563}.mono{font:21px ui-monospace,monospace;fill:#172c2c}.flow{fill:none;stroke:#526563;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="920" height="560" fill="#faf9f5"/>
<text class="title" x="28" y="43" text-anchor="start">Receipt checks precede a new page identity</text>
<text class="note" x="28" y="74" text-anchor="start">Constructed source scenario · CUBRID f799e05 · Not a runtime observation</text>
<rect x="28" y="110" width="410" height="130" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="144" text-anchor="start">1. Allocator locks the BCB</text>
<text class="text" x="46" y="180" text-anchor="start">Valid offer and safe current state?</text>
<text class="text" x="46" y="210" text-anchor="start">Yes in this normal case.</text>
<rect x="502" y="110" width="390" height="130" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="520" y="144" text-anchor="start">2. Detach candidate</text>
<text class="text" x="520" y="180" text-anchor="start">Remove from replacement list</text>
<text class="text" x="520" y="210" text-anchor="start">Return with BCB lock held</text>
<path class="flow" d="M438 175H500"/>
<text class="note" x="448" y="154" text-anchor="start">passes</text>
<rect x="502" y="304" width="390" height="130" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="520" y="338" text-anchor="start">3. Remove old identity</text>
<text class="text" x="520" y="374" text-anchor="start">Allocation path removes the</text>
<text class="text" x="520" y="404" text-anchor="start">lookup mapping for page P</text>
<path class="flow" d="M695 244V300"/>
<text class="note" x="712" y="279" text-anchor="start">continue allocation</text>
<rect x="28" y="304" width="410" height="130" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="338" text-anchor="start">4. Claim the new page</text>
<text class="text" x="46" y="374" text-anchor="start">The same slot can now be reused</text>
<text class="text" x="46" y="404" text-anchor="start">for the requested page</text>
<path class="flow" d="M498 369H442"/>
<text class="note" x="450" y="349" text-anchor="start">then</text>
<rect x="28" y="478" width="864" height="56" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="514" text-anchor="start">A valid offer alone does not remove the old mapping.</text>
</svg>
