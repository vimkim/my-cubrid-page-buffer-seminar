<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">A capped private quota does not redistribute its missing share</title>
  <desc id="desc">Independent constructed update with 20000 occupied frames, four shared lists, private ratio 0.5, and private activities 900 and 100. The private budget is 10000. Raw private quotas 9000 and 1000 become 5000 and 1000 after the 5000 cap; the half-pool cap is inactive. Their sum is 6000, but the shared calculation still subtracts the original budget of 10000, producing a target of 2500 per shared list. Capped-away 4000 is not redistributed.</desc>
  <defs>
    <style>
      .bg{fill:#faf9f5}.box{fill:#fff;stroke:#bccbc5;stroke-width:2}.budget{fill:#e7f0e9;stroke:#006b59}.cap{fill:#f8eee3;stroke:#ad5c16}.h{font:700 28px system-ui,sans-serif;fill:#172c2c}.t{font:700 22px system-ui,sans-serif;fill:#172c2c}.s{font:20px system-ui,sans-serif;fill:#314b48}.small{font:18px system-ui,sans-serif;fill:#526563}.arrow{stroke:#526563;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#526563"/></marker>
  </defs>
  <rect class="bg" width="1000" height="520" rx="8"/>
  <text class="h" x="35" y="45">The budget stays 10,000 even after list quotas are capped</text>
  <text class="small" x="35" y="78">Independent example: 20,000 occupied frames; 4 shared lists; private activities 900 / 100</text>
  <rect class="box budget" x="30" y="105" width="940" height="85" rx="8"/>
  <text class="t" x="50" y="140">Private budget = int(20,000 × 0.5) = 10,000</text>
  <text class="s" x="50" y="173">Each list gets its activity share, then MIN(raw quota, 5,000, 20,000 / 2).</text>
  <path class="arrow" d="M250 190v40"/>
  <path class="arrow" d="M750 190v40"/>
  <rect class="box cap" x="30" y="230" width="450" height="125" rx="8"/>
  <text class="t" x="50" y="269">List 1 · 90% share</text>
  <text class="s" x="50" y="305">Raw 9,000 → published 5,000</text>
  <text class="small" x="50" y="338">4,000 capped away; no redistribution</text>
  <rect class="box" x="520" y="230" width="450" height="125" rx="8"/>
  <text class="t" x="540" y="269">List 2 · 10% share</text>
  <text class="s" x="540" y="305">Raw 1,000 → published 1,000</text>
  <text class="small" x="540" y="338">List quota sum = 5,000 + 1,000 = 6,000</text>
  <path class="arrow" d="M970 148h15v265h-15"/>
  <rect class="box budget" x="30" y="395" width="940" height="90" rx="8"/>
  <text class="t" x="50" y="432">Shared target per list = (20,000 − budget 10,000) / 4 = 2,500</text>
  <text class="s" x="50" y="468">The helper does not replace its budget with the capped list-quota sum.</text>
</svg>
