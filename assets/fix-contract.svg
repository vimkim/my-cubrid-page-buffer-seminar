<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Normal resident hit and cold miss converge on one fix contract</title>
  <desc id="desc">Three caller choices enter a normal fix. Expected absence returns no page and creates no debt. A protected resident hit and a VPID-serialized cold miss converge at identity confirmation, latch grant, and the global and thread debt commit before returning the same successful postcondition.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#48626f"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd7dc;stroke-width:2}.input{fill:#173f57;stroke:#173f57;stroke-width:2}.hit{fill:#e8f5f3;stroke:#16847d;stroke-width:2}.miss{fill:#fff3df;stroke:#b86b22;stroke-width:2}.commit{fill:#edf0ff;stroke:#5968bd;stroke-width:2}.success{fill:#173f57;stroke:#173f57;stroke-width:2}.none{fill:#f6f7f8;stroke:#6b7780;stroke-width:2;stroke-dasharray:8 5}.t{font:700 19px Inter,Arial,sans-serif;fill:#173443}.s{font:15px Inter,Arial,sans-serif;fill:#526874}.tiny{font:13px Inter,Arial,sans-serif;fill:#526874}.w{fill:#fff}.line{fill:none;stroke:#48626f;stroke-width:2.5;marker-end:url(#arrow)}.retry{fill:none;stroke:#6b7780;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="32" y="36" rx="16" width="220" height="116" class="input"/>
  <text x="142" y="70" text-anchor="middle" class="t w">Caller intent</text>
  <text x="142" y="98" text-anchor="middle" class="s w">1. fetch knowledge</text>
  <text x="142" y="122" text-anchor="middle" class="s w">2. latch mode</text>
  <text x="142" y="146" text-anchor="middle" class="s w">3. wait condition</text>

  <path d="M252 94 H326" class="line"/>
  <rect x="327" y="43" rx="16" width="174" height="102" class="box"/>
  <text x="414" y="84" text-anchor="middle" class="t">Locate</text>
  <text x="414" y="112" text-anchor="middle" class="s">resident?</text>

  <path d="M414 145 V208 H548" class="line"/>
  <text x="430" y="183" class="tiny">HIT</text>
  <rect x="549" y="166" rx="16" width="238" height="92" class="hit"/>
  <text x="668" y="201" text-anchor="middle" class="t">Resident hit</text>
  <text x="668" y="229" text-anchor="middle" class="s">lock BCB, recheck VPID</text>

  <path d="M414 145 V354 H548" class="line"/>
  <text x="430" y="330" class="tiny">MISS</text>
  <rect x="549" y="306" rx="16" width="238" height="98" class="miss"/>
  <text x="668" y="340" text-anchor="middle" class="t">Cold miss</text>
  <text x="668" y="367" text-anchor="middle" class="s">VPID load owner prepares BCB</text>
  <text x="668" y="390" text-anchor="middle" class="tiny">DWB or data volume for OLD_PAGE</text>

  <path d="M625 306 V276 H518 V307" class="retry"/>
  <text x="532" y="291" class="tiny">Retry lookup</text>

  <path d="M787 212 H848 V254" class="line"/>
  <path d="M787 355 H848 V306" class="line"/>
  <rect x="811" y="254" rx="16" width="272" height="78" class="box"/>
  <text x="947" y="285" text-anchor="middle" class="t">Identity confirmed</text>
  <text x="947" y="312" text-anchor="middle" class="s">BCB and page header agree</text>

  <path d="M947 332 V374" class="line"/>
  <rect x="811" y="375" rx="16" width="272" height="92" class="commit"/>
  <text x="947" y="408" text-anchor="middle" class="t">Debt commit</text>
  <text x="947" y="436" text-anchor="middle" class="s">latch + global fcnt + thread holder</text>

  <path d="M947 467 V498" class="line"/>
  <rect x="744" y="499" rx="16" width="339" height="50" class="success"/>
  <text x="914" y="530" text-anchor="middle" class="t w">Same success postcondition</text>

  <path d="M327 94 H286 V498 H470" class="retry"/>
  <rect x="471" y="477" rx="14" width="232" height="70" class="none"/>
  <text x="587" y="506" text-anchor="middle" class="t">Expected no page</text>
  <text x="587" y="532" text-anchor="middle" class="s">NULL, no debt</text>
</svg>
