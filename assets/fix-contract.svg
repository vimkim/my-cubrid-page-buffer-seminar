<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Normal resident hit and cold miss converge on one fix contract</title>
  <desc id="desc">Three caller choices enter a normal fix. Expected absence returns no page and creates no debt. A protected resident hit and a VPID-serialized cold miss converge at identity confirmation, latch grant, and the global and thread fix-debt record before returning the same successful postcondition: the page is resident, the latch is granted, both ledgers hold this acquisition, and one borrowed page pointer carries one release debt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#48626f"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd7dc;stroke-width:2}.input{fill:#173f57;stroke:#173f57;stroke-width:2}.hit{fill:#e8f5f3;stroke:#16847d;stroke-width:2}.miss{fill:#fff3df;stroke:#b86b22;stroke-width:2}.commit{fill:#edf0ff;stroke:#5968bd;stroke-width:2}.success{fill:#173f57;stroke:#173f57;stroke-width:2}.none{fill:#f6f7f8;stroke:#6b7780;stroke-width:2;stroke-dasharray:8 5}.t{font:700 19px Inter,Arial,sans-serif;fill:#173443}.s{font:15px Inter,Arial,sans-serif;fill:#526874}.tiny{font:13px Inter,Arial,sans-serif;fill:#526874}.w{fill:#fff}.line{fill:none;stroke:#48626f;stroke-width:2.5;marker-end:url(#arrow)}.retry{fill:none;stroke:#6b7780;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="32" y="36" rx="16" width="220" height="116" class="input"/>
  <text x="142" y="70" text-anchor="middle" class="t w">Caller intent</text>
  <text x="142" y="98" text-anchor="middle" class="s w">1. fetch knowledge</text>
  <text x="142" y="122" text-anchor="middle" class="s w">2. latch mode</text>
  <text x="142" y="146" text-anchor="middle" class="s w">3. wait condition</text>

  <path d="M252 94 H326" class="line"/>
  <rect x="327" y="43" rx="16" width="174" height="102" class="box"/>
  <text x="414" y="84" text-anchor="middle" class="t">Locate</text>
  <text x="414" y="112" text-anchor="middle" class="s">resident?</text>

  <path d="M414 145 V208 H548" class="line"/>
  <text x="430" y="183" class="tiny">HIT</text>
  <rect x="549" y="160" rx="16" width="270" height="98" class="hit"/>
  <text x="684" y="193" text-anchor="middle" class="t">Resident hit</text>
  <text x="684" y="220" text-anchor="middle" class="s">lock BCB, recheck VPID</text>
  <text x="684" y="243" text-anchor="middle" class="tiny">identity recheck 1</text>

  <path d="M414 145 V364 H548" class="line"/>
  <text x="430" y="340" class="tiny">MISS</text>
  <rect x="549" y="302" rx="16" width="270" height="124" class="miss"/>
  <text x="684" y="334" text-anchor="middle" class="t">Cold miss</text>
  <text x="684" y="360" text-anchor="middle" class="s">load owner fills an unpublished BCB</text>
  <text x="684" y="382" text-anchor="middle" class="tiny">OLD_PAGE: DWB image, else data volume</text>
  <text x="684" y="400" text-anchor="middle" class="tiny">NEW_PAGE: initialize, no read</text>
  <text x="684" y="418" text-anchor="middle" class="tiny">other missing threads wait, then retry</text>

  <path d="M640 302 V276 H518 V307" class="retry"/>
  <text x="532" y="291" class="tiny">Retry lookup</text>

  <path d="M819 209 H872 V254" class="line"/>
  <path d="M819 364 H872 V345" class="line"/>
  <rect x="835" y="254" rx="16" width="272" height="90" class="box"/>
  <text x="971" y="284" text-anchor="middle" class="t">Identity confirmed</text>
  <text x="971" y="310" text-anchor="middle" class="s">BCB vpid = page header volid/pageid</text>
  <text x="971" y="332" text-anchor="middle" class="tiny">identity recheck 2</text>

  <path d="M971 344 V386" class="line"/>
  <rect x="835" y="387" rx="16" width="272" height="92" class="commit"/>
  <text x="971" y="420" text-anchor="middle" class="t">Fix debt recorded</text>
  <text x="971" y="448" text-anchor="middle" class="s">latch granted, global fcnt +1,</text>
  <text x="971" y="468" text-anchor="middle" class="s">this thread's holder +1</text>

  <path d="M971 479 V510" class="line"/>
  <rect x="768" y="511" rx="16" width="339" height="84" class="success"/>
  <text x="937" y="540" text-anchor="middle" class="t w">One success postcondition</text>
  <text x="937" y="564" text-anchor="middle" class="s w">resident, latched, both ledgers updated,</text>
  <text x="937" y="584" text-anchor="middle" class="s w">one PAGE_PTR that owes one unfix</text>

  <path d="M327 94 H286 V546 H470" class="retry"/>
  <rect x="471" y="511" rx="14" width="232" height="70" class="none"/>
  <text x="587" y="540" text-anchor="middle" class="t">Expected no page</text>
  <text x="587" y="566" text-anchor="middle" class="s">NULL, no debt</text>
</svg>
