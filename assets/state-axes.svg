<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="state-axes-title state-axes-desc">
  <title id="state-axes-title">Four independent page-buffer state axes</title>
  <desc id="state-axes-desc">Four numbered rows separate identity and residency, ownership, concurrency, and durability and propagation. Each row names its own question and example positions so meaning does not depend on color.</desc>
  <defs>
    <style>
      .title { font: 700 25px Inter, Arial, sans-serif; fill: #173443; }
      .subtitle { font: 15px Inter, Arial, sans-serif; fill: #526874; }
      .axis-title { font: 700 18px Inter, Arial, sans-serif; fill: #173443; }
      .question { font: 14px Inter, Arial, sans-serif; fill: #405763; }
      .state { font: 700 13px Inter, Arial, sans-serif; fill: #173443; }
      .row1 { fill: #edf5ff; stroke: #2f6690; stroke-width: 2; }
      .row2 { fill: #eef8f4; stroke: #287966; stroke-width: 2; }
      .row3 { fill: #fff8ea; stroke: #9a672f; stroke-width: 2; }
      .row4 { fill: #fff1f2; stroke: #a74850; stroke-width: 2; }
      .chip { fill: #ffffff; stroke: #718791; stroke-width: 1.5; }
      .divider { stroke: #718791; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="610" rx="22" fill="#ffffff" stroke="#d8e1e5" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" class="title">One page has four state coordinates, not one scalar state</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Example positions are independent coordinates; they are not one mandatory sequence.</text>

  <rect x="45" y="110" width="1110" height="105" rx="16" class="row1"/>
  <text x="70" y="143" class="axis-title">1. Identity / residency</text>
  <text x="70" y="171" class="question">Which VPID, if any, does this BCB and Frame currently represent?</text>
  <rect x="630" y="130" width="140" height="52" rx="10" class="chip"/><text x="700" y="161" text-anchor="middle" class="state">not resident</text>
  <rect x="785" y="130" width="155" height="52" rx="10" class="chip"/><text x="863" y="153" text-anchor="middle" class="state">resident</text><text x="863" y="171" text-anchor="middle" class="question">VPID ↔ BCB/Frame</text>
  <rect x="955" y="130" width="170" height="52" rx="10" class="chip"/><text x="1040" y="153" text-anchor="middle" class="state">invalidated / reused</text><text x="1040" y="171" text-anchor="middle" class="question">possibly another VPID</text>

  <rect x="45" y="230" width="1110" height="105" rx="16" class="row2"/>
  <text x="70" y="263" class="axis-title">2. Ownership</text>
  <text x="70" y="291" class="question">Which granted fixes prevent ordinary Frame reuse?</text>
  <rect x="630" y="250" width="140" height="52" rx="10" class="chip"/><text x="700" y="281" text-anchor="middle" class="state">global fcnt = 0</text>
  <rect x="785" y="250" width="155" height="52" rx="10" class="chip"/><text x="863" y="281" text-anchor="middle" class="state">global fcnt &gt; 0</text>
  <rect x="955" y="250" width="170" height="52" rx="10" class="chip"/><text x="1040" y="273" text-anchor="middle" class="state">Thread holder</text><text x="1040" y="291" text-anchor="middle" class="question">nested fix_count debt</text>

  <rect x="45" y="350" width="1110" height="105" rx="16" class="row3"/>
  <text x="70" y="383" class="axis-title">3. Concurrency</text>
  <text x="70" y="411" class="question">Who may inspect or mutate the resident bytes now?</text>
  <rect x="630" y="370" width="140" height="52" rx="10" class="chip"/><text x="700" y="401" text-anchor="middle" class="state">NO_LATCH</text>
  <rect x="785" y="370" width="155" height="52" rx="10" class="chip"/><text x="863" y="401" text-anchor="middle" class="state">READ / WRITE</text>
  <rect x="955" y="370" width="170" height="52" rx="10" class="chip"/><text x="1040" y="393" text-anchor="middle" class="state">incompatible request</text><text x="1040" y="411" text-anchor="middle" class="question">wait or reject</text>

  <rect x="45" y="470" width="1110" height="105" rx="16" class="row4"/>
  <text x="70" y="503" class="axis-title">4. Durability / propagation</text>
  <text x="70" y="531" class="question">Which generation needs propagation, and what recovery boundary is established?</text>
  <rect x="630" y="490" width="140" height="52" rx="10" class="chip"/><text x="700" y="521" text-anchor="middle" class="state">clean resident</text>
  <rect x="785" y="490" width="155" height="52" rx="10" class="chip"/><text x="863" y="521" text-anchor="middle" class="state">DIRTY</text>
  <rect x="955" y="490" width="170" height="52" rx="10" class="chip"/><text x="1040" y="513" text-anchor="middle" class="state">FLUSHING snapshot</text><text x="1040" y="531" text-anchor="middle" class="question">new re-dirty may coexist</text>

  <line x1="45" y1="594" x2="1155" y2="594" class="divider"/>
  <text x="600" y="618" text-anchor="middle" class="subtitle">Fixed ≠ resident · DIRTY ≠ durable · unfix ≠ flush · eviction ≠ deallocation</text>
</svg>
