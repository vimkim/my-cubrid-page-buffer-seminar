<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
<title id="title">One waiter wakes; the allocator still waits</title>
<desc id="desc">A clean unused page has an attached flush waiter. That waiter blocks an offer during the current check. Post-flush still clears FLUSHING and removes and wakes the flush waiter. The allocator gets no offer in this pass.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526563"/></marker>
<style>.title{font:700 28px system-ui,sans-serif;fill:#172c2c}.head{font:700 24px system-ui,sans-serif;fill:#172c2c}.text{font:22px system-ui,sans-serif;fill:#172c2c}.note{font:19px system-ui,sans-serif;fill:#526563}.mono{font:21px ui-monospace,monospace;fill:#172c2c}.flow{fill:none;stroke:#526563;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs>
<rect width="920" height="550" fill="#faf9f5"/>
<text class="title" x="28" y="43" text-anchor="start">One waiter wakes; the allocator still waits</text>
<text class="note" x="28" y="74" text-anchor="start">Constructed source scenario · CUBRID f799e05 · Not a runtime observation</text>
<rect x="28" y="110" width="864" height="96" rx="5" fill="#fff" stroke="#bccdc5" stroke-width="2"/>
<text class="head" x="46" y="144" text-anchor="start">Starting BCB for page P</text>
<text class="text" x="46" y="180" text-anchor="start">Clean, unused, policy permits reuse — but a flush waiter is attached.</text>
<rect x="28" y="258" width="410" height="162" rx="5" fill="#f8eee3" stroke="#ad5c16" stroke-width="2"/>
<text class="head" x="46" y="292" text-anchor="start">Offer check: reject</text>
<text class="text" x="46" y="328" text-anchor="start">Attached waiter blocks this offer</text>
<text class="text" x="46" y="358" text-anchor="start">Allocator gets no pointer</text>
<text class="text" x="46" y="388" text-anchor="start">No offer retry in the same pass</text>
<rect x="502" y="258" width="390" height="162" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="520" y="292" text-anchor="start">Completion still runs</text>
<text class="text" x="520" y="328" text-anchor="start">FLUSHING: 1 → 0</text>
<text class="text" x="520" y="358" text-anchor="start">Wake flush waiter</text>
<text class="text" x="520" y="388" text-anchor="start">The waiter can continue</text>
<path class="flow" d="M460 210V234H233V254"/>
<text class="note" x="48" y="241" text-anchor="start">check while attached</text>
<path class="flow" d="M438 338H500"/>
<text class="note" x="446" y="317" text-anchor="start">then</text>
<rect x="28" y="468" width="864" height="56" rx="5" fill="#e7f0e9" stroke="#006b59" stroke-width="2"/>
<text class="head" x="46" y="504" text-anchor="start">Flush-wait notification supplies no frame to the allocator.</text>
</svg>
